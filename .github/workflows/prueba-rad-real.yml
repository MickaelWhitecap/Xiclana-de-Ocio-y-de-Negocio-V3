name: Prueba real RAD — Chiclana

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prueba-rad-real:
    name: Ejecutar Gran Rastreo RAD aislado
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Descargar catálogo maestro de main
        uses: actions/checkout@v4
      - name: Descargar código RAD
        uses: actions/checkout@v4
        with:
          ref: gran-rastreo-multifuente
          path: rad-source
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Preparar copia aislada del catálogo
        run: cp v3/fichas_completas.json "$RUNNER_TEMP/fichas_completas_rad.json"
      - name: Ejecutar rastreo real sin modificar el catálogo maestro
        run: python rad-source/v3/rastreo_web_publico.py --catalog "$RUNNER_TEMP/fichas_completas_rad.json"
      - name: Generar informe de candidatas detectadas
        run: |
          python - <<'PY'
          import json, os
          original=json.load(open("v3/fichas_completas.json",encoding="utf-8"))
          path=os.path.join(os.environ["RUNNER_TEMP"],"fichas_completas_rad.json")
          result=json.load(open(path,encoding="utf-8"))
          old={x.get("id") for x in original.get("candidatas_revision",[]) if isinstance(x,dict)}
          candidates=[x for x in result.get("candidatas_revision",[]) if isinstance(x,dict) and x.get("id") not in old and str(x.get("id","")).startswith("rad:")]
          report={"rad_ultima_ejecucion":result.get("rad_ultima_ejecucion",{}),"candidatas_nuevas":candidates,
                  "nota":"Prueba aislada. Ninguna candidata se ha publicado ni incorporado al catálogo principal."}
          with open("rad_prueba_resultado.json","w",encoding="utf-8") as f:
              json.dump(report,f,ensure_ascii=False,indent=2)
          print(json.dumps({"resumen":report["rad_ultima_ejecucion"],"candidatas_en_informe":len(candidates)},ensure_ascii=False))
          PY
      - name: Publicar informe RAD como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: rad-prueba-real-chiclana-${{ github.run_id }}
          path: rad_prueba_resultado.json
          if-no-files-found: error
          retention-days: 14
