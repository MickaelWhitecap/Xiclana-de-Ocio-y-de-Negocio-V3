name: RAD - enriquecimiento del catálogo global

on:
  push:
    branches: [main]
    paths:
      - 'v3/rastreo_web_publico.py'
      - '.github/workflows/rad-enrich-catalog.yml'
  schedule:
    - cron: "47 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rad-enriquecimiento-catalogo-global
  cancel-in-progress: true

jobs:
  enrich-global-catalog:
    name: Enriquecer fichas y conservar candidatas pendientes
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Descargar main y catálogo maestro
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Guardar copia de seguridad de trabajo y ejecutar RAD
        run: |
          cp v3/fichas_completas.json "$RUNNER_TEMP/fichas_completas_antes_rad.json"
          cp v3/fichas_completas.json "$RUNNER_TEMP/fichas_completas_rad.json"
          python v3/rastreo_web_publico.py --catalog "$RUNNER_TEMP/fichas_completas_rad.json"
      - name: Validar integridad y preparar resumen
        run: |
          python - <<'PY'
          import json, os
          before=json.load(open(os.path.join(os.environ["RUNNER_TEMP"],"fichas_completas_antes_rad.json"),encoding="utf-8"))
          path=os.path.join(os.environ["RUNNER_TEMP"],"fichas_completas_rad.json")
          after=json.load(open(path,encoding="utf-8"))
          rad=after.get("rad_ultima_ejecucion",{})
          assert isinstance(after.get("items"),list), "Catálogo sin items"
          assert len(after["items"]) == len(before.get("items",[])), "RAD ha alterado el número de fichas publicadas"
          assert rad.get("publicacion_automatica") is False, "Publicación automática no permitida"
          old_ids={x.get("id") for x in before.get("candidatas_revision",[]) if isinstance(x,dict)}
          new_candidates=[x for x in after.get("candidatas_revision",[]) if isinstance(x,dict) and x.get("id") not in old_ids]
          assert all(x.get("estado_revision")=="pendiente" for x in new_candidates), "Hay candidatas nuevas que no están pendientes"
          assert all(x.get("url_fuente_rastreo") for x in new_candidates), "Hay candidatas sin URL de procedencia"
          summary={
            "fichas_publicadas":len(after["items"]),
            "fichas_enriquecidas":rad.get("fichas_enriquecidas",0),
            "campos_actualizados":rad.get("campos_actualizados",0),
            "candidatas_nuevas":len(new_candidates),
            "urls_encontradas":rad.get("urls_encontradas",0),
            "coincidencias_catalogo":rad.get("coincidencias_catalogo",0),
            "fuentes_directas":rad.get("fuentes_directas",[]),
            "publicacion_automatica":rad.get("publicacion_automatica")
          }
          with open("rad-enriquecimiento-resumen.json","w",encoding="utf-8") as f:
              json.dump(summary,f,ensure_ascii=False,indent=2)
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a",encoding="utf-8") as f:
              f.write("## Resultado RAD sobre el catálogo global\\n\\n")
              for key,value in summary.items():
                  f.write(f"- **{key}:** {value}\\n")
          print(json.dumps(summary,ensure_ascii=False))
          PY
      - name: Integrar los datos en el fichero global
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, shutil
          p=os.path.join(os.environ["RUNNER_TEMP"],"fichas_completas_rad.json")
          d=json.load(open(p,encoding="utf-8"))
          r=d.get("rad_ultima_ejecucion",{})
          if not (r.get("fichas_enriquecidas",0) or r.get("candidatas_nuevas",0)):
              print("Sin cambios de datos: no se genera un commit.")
              raise SystemExit(0)
          shutil.copyfile(p,"v3/fichas_completas.json")
          PY
          if git diff --quiet -- v3/fichas_completas.json; then
            echo "No hay cambios de datos que integrar."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v3/fichas_completas.json
          git commit -m "Enriquecer catálogo global con fuentes RAD"
          git fetch origin main
          git rebase origin/main
          size=$(wc -c < v3/fichas_completas.json)
          echo "Tamaño del catálogo maestro tras RAD: $size bytes"
          if [ "$size" -ge 100000000 ]; then
            echo "::error::El catálogo supera el límite de 100 MB de GitHub; se cancela la integración sin modificar main."
            exit 1
          fi
          git push origin HEAD:main
      - name: Guardar informe RAD
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rad-enriquecimiento-global-${{ github.run_id }}
          path: rad-enriquecimiento-resumen.json
          if-no-files-found: ignore
          retention-days: 30
