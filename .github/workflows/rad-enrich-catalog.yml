name: RAD - descubrimiento y propuestas desde Supabase

on:
  push:
    branches: [main]
    paths:
      - "v3/rastreo_web_publico.py"
      - "v3/rad_lotes.py"
      - ".github/workflows/rad-enrich-catalog.yml"
  schedule:
    - cron: "47 6 * * 1"
      timezone: "Europe/Madrid"
  workflow_dispatch:
    inputs:
      continuation:
        description: "Continuación automática del siguiente lote"
        required: false
        default: "false"
        type: string

permissions:
  contents: read
  actions: write

concurrency:
  group: rad-descubrimiento-supabase-v2
  cancel-in-progress: false

jobs:
  discovery:
    name: Procesar un lote RAD de 50 fichas y guardar checkpoint
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Descargar código de main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1
      - name: Preparar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Ejecutar pruebas internas RAD
        run: |
          python v3/rastreo_web_publico.py --self-test
          python v3/rad_lotes.py --self-test
      - name: Investigar y confirmar un lote de hasta 50 fichas
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python v3/rad_lotes.py
      - name: Publicar resumen del lote
        if: always()
        run: |
          if [ -f rad-lotes-result.json ]; then
            python - <<'PY'
          import json, os
          from pathlib import Path
          result=json.loads(Path("rad-lotes-result.json").read_text(encoding="utf-8"))
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a",encoding="utf-8") as f:
              f.write("## RAD: lote confirmado en Supabase\n\n")
              for key,value in result.items():
                  f.write(f"- **{key}:** {value}\n")
          print(json.dumps(result,ensure_ascii=False))
          PY
          fi
      - name: Encadenar automáticamente el siguiente lote
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          result=json.loads(Path("rad-lotes-result.json").read_text(encoding="utf-8"))
          print("MORE" if result.get("status") in ("more","last_batch") else "DONE")
          PY
          status=$(python -c 'import json; print(json.load(open("rad-lotes-result.json")).get("status",""))')
          if [ "$status" = "more" ] || [ "$status" = "last_batch" ]; then
            gh workflow run rad-enrich-catalog.yml --ref main -f continuation=true
          fi
      - name: Guardar informe RAD
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rad-lote-supabase-${{ github.run_id }}
          path: rad-lotes-result.json
          if-no-files-found: ignore
          retention-days: 30
