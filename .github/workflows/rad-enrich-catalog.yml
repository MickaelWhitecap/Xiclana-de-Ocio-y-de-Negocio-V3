name: RAD - descubrimiento y propuestas desde Supabase

on:
  push:
    branches: [main]
    paths:
      - 'v3/rastreo_web_publico.py'
      - 'v3/catalogo_supabase.py'
      - '.github/workflows/rad-enrich-catalog.yml'
  schedule:
    - cron: "47 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rad-descubrimiento-supabase
  cancel-in-progress: false

jobs:
  discovery:
    name: Rastrear fuentes y guardar propuestas pendientes
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Descargar código de main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1
      - name: Preparar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Exportar copia temporal del catálogo canónico
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python v3/catalogo_supabase.py export --output "$RUNNER_TEMP/xiclana-rad.json"
          cp "$RUNNER_TEMP/xiclana-rad.json" "$RUNNER_TEMP/xiclana-rad-antes.json"
      - name: Ejecutar pruebas internas RAD
        run: python v3/rastreo_web_publico.py --self-test
      - name: Ejecutar rastreo sobre la copia temporal
        run: python v3/rastreo_web_publico.py --catalog "$RUNNER_TEMP/xiclana-rad.json"
      - name: Validar resultados y preparar informe
        run: |
          python - <<'PY'
          import json, os
          root=os.environ["RUNNER_TEMP"]
          before=json.load(open(os.path.join(root,"xiclana-rad-antes.json"),encoding="utf-8"))
          after=json.load(open(os.path.join(root,"xiclana-rad.json"),encoding="utf-8"))
          rad=after.get("rad_ultima_ejecucion",{})
          assert isinstance(after.get("items"),list), "La copia temporal no contiene items"
          assert len(after["items"]) == len(before.get("items",[])), "RAD ha alterado el número de fichas"
          assert rad.get("publicacion_automatica") is False, "RAD no puede publicar automáticamente"
          old_ids={str(x.get("id")) for x in before.get("candidatas_revision",[]) if isinstance(x,dict)}
          candidates=[x for x in after.get("candidatas_revision",[]) if isinstance(x,dict) and str(x.get("id","")).startswith("rad:") and str(x.get("id")) not in old_ids]
          assert all(x.get("estado_revision")=="pendiente" for x in candidates), "Hay candidatas nuevas que no están pendientes"
          assert all(str(x.get("url_fuente_rastreo","")).startswith(("http://","https://")) for x in candidates), "Hay candidatas sin procedencia"
          summary={
            "fichas_consultadas":len(after["items"]),
            "fichas_con_sugerencias_de_enriquecimiento":rad.get("fichas_enriquecidas",0),
            "campos_con_sugerencias":rad.get("campos_actualizados",0),
            "candidatas_nuevas_pendientes":len(candidates),
            "urls_encontradas":rad.get("urls_encontradas",0),
            "coincidencias_catalogo":rad.get("coincidencias_catalogo",0),
            "fuentes_directas":rad.get("fuentes_directas",[]),
            "publicacion_automatica":False,
            "fichas_modificadas_en_supabase":"pendiente de sincronización"
          }
          with open("rad-enriquecimiento-resumen.json","w",encoding="utf-8") as f:
            json.dump(summary,f,ensure_ascii=False,indent=2)
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a",encoding="utf-8") as f:
            f.write("## Resultado RAD sobre el catálogo Supabase\n\n")
            for key,value in summary.items(): f.write(f"- **{key}:** {value}\n")
          print(json.dumps(summary,ensure_ascii=False))
          PY
      - name: Aplicar enriquecimientos seguros a fichas verificadas
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python v3/catalogo_supabase.py sync-enrichment \
            --before "$RUNNER_TEMP/xiclana-rad-antes.json" \
            --after "$RUNNER_TEMP/xiclana-rad.json" > rad-enrichment-sync.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          sync=json.loads(Path("rad-enrichment-sync.json").read_text(encoding="utf-8"))
          path=Path(os.path.join(os.environ["RUNNER_TEMP"],"xiclana-rad.json"))
          data=json.loads(path.read_text(encoding="utf-8"))
          rad=data.get("rad_ultima_ejecucion",{})
          rad["fichas_modificadas_en_supabase"]=sync.get("fichas_actualizadas",0)
          rad["campos_aplicados_en_supabase"]=sync.get("campos_actualizados",0)
          rad["fichas_omitidas_por_cambio_concurrente"]=sync.get("saltadas_por_cambio_concurrente",0)
          rad["fichas_omitidas_por_no_verificadas_o_inactivas"]=sync.get("saltadas_por_no_verificadas_o_inactivas",0)
          data["rad_ultima_ejecucion"]=rad
          path.write_text(json.dumps(data,ensure_ascii=False,separators=(",",":")),encoding="utf-8")
          summary=json.loads(Path("rad-enriquecimiento-resumen.json").read_text(encoding="utf-8"))
          summary.update({
            "fichas_modificadas_en_supabase":sync.get("fichas_actualizadas",0),
            "campos_aplicados_en_supabase":sync.get("campos_actualizados",0),
            "fichas_omitidas_por_cambio_concurrente":sync.get("saltadas_por_cambio_concurrente",0),
            "fichas_omitidas_por_no_verificadas_o_inactivas":sync.get("saltadas_por_no_verificadas_o_inactivas",0)
          })
          Path("rad-enriquecimiento-resumen.json").write_text(json.dumps(summary,ensure_ascii=False,indent=2),encoding="utf-8")
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a",encoding="utf-8") as f:
              f.write("\n### Enriquecimientos aplicados\n\n")
              for key,value in sync.items(): f.write(f"- **{key}:** {value}\n")
          print(json.dumps(sync,ensure_ascii=False))
          PY
      - name: Guardar candidatas RAD como metadatos pendientes
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python v3/catalogo_supabase.py sync-metadata \
            --input "$RUNNER_TEMP/xiclana-rad.json" \
            --keys candidatas_revision total_candidatas_revision rad_ultima_ejecucion
      - name: Guardar informe RAD
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rad-descubrimiento-supabase-${{ github.run_id }}
          path: rad-enriquecimiento-resumen.json
          if-no-files-found: ignore
          retention-days: 30
