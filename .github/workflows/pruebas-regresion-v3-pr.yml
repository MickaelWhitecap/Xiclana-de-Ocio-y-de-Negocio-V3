name: Pruebas de regresión V3 (PR)

on:
  pull_request:
    branches: [main]
    paths:
      - "v3/*.py"
      - "v3/test_*.py"
      - ".github/workflows/pruebas-regresion-v3-pr.yml"

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ejecutar pruebas de regresión del catálogo
        run: python -m unittest v3/test_auditar_catalogo.py
