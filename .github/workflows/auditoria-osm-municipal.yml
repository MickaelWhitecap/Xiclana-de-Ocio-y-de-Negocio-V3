name: Auditoría municipal completa de OpenStreetMap

on:
  workflow_dispatch:
    inputs:
      modo:
        description: "Tipo de ejecución manual"
        required: true
        type: choice
        default: osm
        options:
          - osm
          - rad
  push:
    branches: [main]
    paths:
      - "v3/incorporar_candidatas_osm.py"
      - "v3/proponer_direcciones_osm.py"
      - "v3/catalogo_supabase.py"
      - ".github/workflows/auditoria-osm-municipal.yml"
  schedule:
    - cron: "30 4 * * 1"

permissions:
  contents: read

concurrency:
  group: xiclana-propuestas-supabase
  cancel-in-progress: false

jobs:
  # Prueba RAD manual: usa el código de la rama de desarrollo y una copia temporal
  # del catálogo de main. No escribe en el repositorio ni publica candidatas.
  prueba-rad-real:
    if: github.event_name == 'workflow_dispatch' && inputs.modo == 'rad'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Descargar catálogo maestro de main
        uses: actions/checkout@v7
      - name: Descargar código RAD de la rama de desarrollo
        uses: actions/checkout@v7
        with:
          ref: gran-rastreo-multifuente
          path: rad-source
      - name: Preparar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Ejecutar pruebas internas del rastreador RAD
        run: python rad-source/v3/rastreo_web_publico.py --self-test
      - name: Exportar catálogo vigente desde Supabase
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python v3/catalogo_supabase.py export --output "$RUNNER_TEMP/fichas_completas_rad.json"
          cp "$RUNNER_TEMP/fichas_completas_rad.json" "$RUNNER_TEMP/fichas_completas_rad_antes.json"
      - name: Ejecutar rastreo real sobre copia temporal de Supabase
        run: python rad-source/v3/rastreo_web_publico.py --catalog "$RUNNER_TEMP/fichas_completas_rad.json"
      - name: Generar informe de candidatas detectadas
        run: |
          python - <<'PY'
          import json, os
          original=json.load(open(os.path.join(os.environ["RUNNER_TEMP"],"fichas_completas_rad_antes.json"),encoding="utf-8"))
          path=os.path.join(os.environ["RUNNER_TEMP"],"fichas_completas_rad.json")
          result=json.load(open(path,encoding="utf-8"))
          old={x.get("id") for x in original.get("candidatas_revision",[]) if isinstance(x,dict)}
          candidates=[x for x in result.get("candidatas_revision",[]) if isinstance(x,dict) and x.get("id") not in old and str(x.get("id","")).startswith("rad:")]
          report={"rad_ultima_ejecucion":result.get("rad_ultima_ejecucion",{}),"candidatas_nuevas":candidates,
                  "nota":"Prueba aislada. Ninguna candidata se ha publicado ni incorporado al catálogo principal."}
          with open("rad_prueba_resultado.json","w",encoding="utf-8") as f:
              json.dump(report,f,ensure_ascii=False,indent=2)
          print(json.dumps({"resumen":report["rad_ultima_ejecucion"],"candidatas_en_informe":len(candidates)},ensure_ascii=False))
          PY
      - name: Publicar informe de prueba como artefacto
        uses: actions/upload-artifact@v7
        with:
          name: rad-prueba-real-chiclana-${{ github.run_id }}
          path: rad_prueba_resultado.json
          if-no-files-found: error
          retention-days: 14

  extraccion-y-cruce:
    if: github.event_name != 'workflow_dispatch' || inputs.modo != 'rad'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7

      - name: Preparar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Exportar catálogo canónico desde Supabase a copia temporal
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python v3/catalogo_supabase.py export --output "$RUNNER_TEMP/xiclana-catalogo-temporal.json"
          echo "XICLANA_CATALOG_PATH=$RUNNER_TEMP/xiclana-catalogo-temporal.json" >> "$GITHUB_ENV"

      - name: Extraer todos los elementos OSM y cruzar con listings
        run: python v3/auditar_osm_municipal.py

      - name: Comparar consulta semanal con la extracción inicial
        if: success()
        run: python v3/comparar_cambios_osm.py

      - name: Generar propuestas de direcciones para fichas sin dirección
        if: success()
        run: python v3/proponer_direcciones_osm.py

      - name: Incorporar candidatas OSM al bloque de revisión de Administración
        if: success()
        run: python v3/incorporar_candidatas_osm.py

      - name: Guardar propuestas OSM en metadatos de Supabase
        if: success()
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python v3/catalogo_supabase.py sync-metadata \
            --input "$RUNNER_TEMP/xiclana-catalogo-temporal.json" \
            --keys candidatas_revision total_candidatas_revision propuestas_direcciones_osm integracion_osm_revision auditoria_osm_objetos_sin_ficha

      - name: Publicar resumen de auditoría
        if: always()
        run: |
          if [ -f v3/osm_chiclana_cruce_catalogo.json ]; then
            python - <<'PY'
          import json
          d=json.load(open("v3/osm_chiclana_cruce_catalogo.json", encoding="utf-8"))
          e=d["extraccion"]; c=d["cruce"]
          lines=[
            "## Auditoría municipal OSM — Chiclana",
            f"- Elementos recuperados: **{e['total_elementos']}**",
            f"- Nodos / vías / relaciones: **{e['por_tipo']}**",
            f"- Elementos con etiquetas: **{e['elementos_con_etiquetas']}**",
            f"- Elementos con nombre: **{e['elementos_con_nombre']}**",
            f"- Elementos con geometría: **{e['elementos_con_geometria_completa']}**",
            f"- Coincidencias por ID: **{c['coincidencia_por_id_osm']}**",
            f"- Coincidencias nombre + coordenadas: **{c['coincidencia_nombre_y_coordenadas_150m']}**",
            f"- Coincidencias solo por nombre (sin confirmar): **{c['coincidencia_nombre_sin_confirmacion_espacial']}**",
            f"- Posibles fichas nuevas sin incorporar: **{c['elementos_osm_con_nombre_sin_ficha_candidata']}**",
            "",
            "La extracción y el cruce no modifican ni publican fichas del catálogo maestro."
          ]
          open(__import__("os").environ["GITHUB_STEP_SUMMARY"],"w",encoding="utf-8").write("\n".join(lines))
          PY
          else
            echo "## Auditoría OSM no completada" >> "$GITHUB_STEP_SUMMARY"
            echo "No se generó el informe. Consultar los registros de Overpass." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publicar resumen de novedades y cambios
        if: success() && hashFiles('v3/osm_chiclana_cambios_semanales.json') != ''
        run: |
          python - <<'PY'
          import json, os
          p=json.load(open("v3/osm_chiclana_cambios_semanales.json", encoding="utf-8"))
          r=p["resumen"]
          lines=[
            "",
            "## Cambios OSM respecto a la extracción inicial",
            f"- Objetos en la extracción inicial: **{r['objetos_iniciales']}**",
            f"- Objetos en la consulta actual: **{r['objetos_actuales']}**",
            f"- Objetos nuevos: **{r['objetos_nuevos']}**",
            f"- Objetos con cambios de contenido: **{r['objetos_con_cambios_de_contenido']}**",
            f"- Objetos que ya no aparecen: **{r['objetos_eliminados_de_osm']}**",
            f"- Cambios solo de metadatos: **{r['objetos_con_solo_cambio_de_metadatos']}**",
            "",
            "El informe detallado queda adjunto como artefacto. No se modifica ni publica el catálogo."
          ]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("\n".join(lines) + "\n")
          PY

      - name: Añadir resumen de propuestas de direcciones
        if: success() && hashFiles('v3/propuestas_direcciones_osm.json') != ''
        run: |
          python - <<'PY'
          import json, os
          p=json.load(open("v3/propuestas_direcciones_osm.json", encoding="utf-8"))
          r=p["resumen"]
          lines=[
            "",
            "## Propuestas de direcciones para fichas sin dirección",
            f"- Fichas activas sin dirección: **{r['fichas_activas_sin_direccion']}**",
            f"- Con ID OSM: **{r['sin_direccion_con_id_osm']}**",
            f"- Sin ID OSM: **{r['sin_direccion_sin_id_osm']}**",
            f"- Propuestas generadas: **{r['propuestas_direccion_generadas']}**",
            f"- Sin etiquetas postales utilizables: **{r['sin_etiquetas_postales_utilizables']}**",
            "- Direcciones existentes sobrescritas: **0**",
            "- Fichas publicadas automáticamente: **0**"
          ]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("\n".join(lines) + "\n")
          PY

      - name: Guardar extracción completa, auditoría y diferencias
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: auditoria-osm-chiclana-${{ github.run_id }}
          path: |
            v3/osm_chiclana_extraccion_completa.json
            v3/osm_chiclana_cruce_catalogo.json
            v3/osm_chiclana_cambios_semanales.json
            v3/propuestas_direcciones_osm.json
            v3/osm_candidatas_resumen.json
            v3/osm_candidatas_pendientes.json
          if-no-files-found: warn
          compression-level: 6
          retention-days: 8
