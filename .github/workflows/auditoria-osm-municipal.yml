name: Auditoría municipal completa de OpenStreetMap

on:
  workflow_dispatch:
  push:
    branches: [main, gran-rastreo-multifuente]
    paths:
      - ".github/workflows/auditoria-osm-municipal.yml"
      - "v3/incorporar_candidatas_osm.py"
      - "v3/proponer_direcciones_osm.py"
      - "v3/rastreo_web_publico.py"
  schedule:
    - cron: "30 4 * * 1"

permissions:
  contents: write

concurrency:
  group: xiclana-osm-semanal
  cancel-in-progress: false

jobs:
  # La rama de desarrollo ejecuta únicamente validaciones: nunca escribe en main.
  validacion-rad:
    if: github.ref == 'refs/heads/gran-rastreo-multifuente'
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Comprobar sintaxis y pruebas internas RAD
        run: |
          python -m py_compile v3/rastreo_web_publico.py
          python v3/rastreo_web_publico.py --self-test

  extraccion-y-cruce:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validar sintaxis y pruebas internas del rastreador RAD
        run: |
          python -m py_compile v3/rastreo_web_publico.py
          python v3/rastreo_web_publico.py --self-test

      - name: Extraer todos los elementos OSM y cruzar con catálogo maestro
        run: python v3/auditar_osm_municipal.py

      - name: Comparar consulta semanal con la extracción inicial
        if: success()
        run: python v3/comparar_cambios_osm.py

      - name: Generar propuestas de direcciones para fichas sin dirección
        if: success()
        run: python v3/proponer_direcciones_osm.py

      - name: Incorporar candidatas OSM al bloque de revisión de Administración
        if: success()
        run: python v3/incorporar_candidatas_osm.py

      - name: Rastrear fuentes web públicas y preparar candidatas RAD
        if: success()
        run: python v3/rastreo_web_publico.py

      - name: Guardar propuestas OSM y RAD pendientes para Administración
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v3/fichas_completas.json
          if git diff --cached --quiet; then
            echo "No hay cambios en las propuestas OSM/RAD del catálogo maestro."
          else
            git commit -m "Actualizar propuestas OSM y RAD pendientes de revisión"
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                echo "Catálogo maestro actualizado en main."
                exit 0
              fi
              echo "Push concurrente; reintentando ($attempt/3)."
              sleep 3
            done
            echo "No se pudo actualizar main tras tres intentos."
            exit 1
          fi

      - name: Publicar resumen de auditoría
        if: always()
        run: |
          if [ -f v3/osm_chiclana_cruce_catalogo.json ]; then
            python - <<'PY'
          import json
          d=json.load(open("v3/osm_chiclana_cruce_catalogo.json", encoding="utf-8"))
          e=d["extraccion"]; c=d["cruce"]
          lines=[
            "## Auditoría municipal OSM + rastreo web público RAD — Chiclana",
            f"- Elementos recuperados: **{e['total_elementos']}**",
            f"- Nodos / vías / relaciones: **{e['por_tipo']}**",
            f"- Elementos con etiquetas: **{e['elementos_con_etiquetas']}**",
            f"- Elementos con nombre: **{e['elementos_con_nombre']}**",
            f"- Elementos con geometría: **{e['elementos_con_geometria_completa']}**",
            f"- Coincidencias por ID: **{c['coincidencia_por_id_osm']}**",
            f"- Coincidencias nombre + coordenadas: **{c['coincidencia_nombre_y_coordenadas_150m']}**",
            f"- Coincidencias solo por nombre (sin confirmar): **{c['coincidencia_nombre_sin_confirmacion_espacial']}**",
            f"- Posibles fichas nuevas sin incorporar: **{c['elementos_osm_con_nombre_sin_ficha_candidata']}**",
            "",
            "Las propuestas detectadas quedan pendientes de validación manual; no se publican automáticamente."
          ]
          open(__import__("os").environ["GITHUB_STEP_SUMMARY"],"w",encoding="utf-8").write("\n".join(lines))
          PY
          else
            echo "## Auditoría OSM no completada" >> "$GITHUB_STEP_SUMMARY"
            echo "No se generó el informe. Consultar los registros de Overpass." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publicar resumen del Gran Rastreo RAD
        if: success() && hashFiles('v3/fichas_completas.json') != ''
        run: |
          python - <<'PY'
          import json, os
          d=json.load(open("v3/fichas_completas.json", encoding="utf-8"))
          r=d.get("rad_ultima_ejecucion", {})
          lines=[
            "",
            "## Gran Rastreo web público (RAD)",
            f"- Fecha UTC: **{r.get('fecha_utc', 'sin dato')}**",
            f"- Buscadores consultados: **{', '.join(r.get('buscadores', []))}**",
            f"- Fuentes directas: **{', '.join(r.get('fuentes_directas', []))}**",
            f"- Consultas sectoriales: **{r.get('consultas', 0)}**",
            f"- URLs encontradas: **{r.get('urls_encontradas', 0)}**",
            f"- Candidatas nuevas: **{r.get('candidatas_nuevas', 0)}**",
            "- Publicación automática: **no**",
            "- Destino: catálogo maestro, bloque de revisión de Administración"
          ]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("\n".join(lines) + "\n")
          PY

      - name: Publicar resumen de novedades y cambios
        if: success() && hashFiles('v3/osm_chiclana_cambios_semanales.json') != ''
        run: |
          python - <<'PY'
          import json, os
          p=json.load(open("v3/osm_chiclana_cambios_semanales.json", encoding="utf-8"))
          r=p["resumen"]
          lines=[
            "",
            "## Cambios OSM respecto a la extracción inicial",
            f"- Objetos en la extracción inicial: **{r['objetos_iniciales']}**",
            f"- Objetos en la consulta actual: **{r['objetos_actuales']}**",
            f"- Objetos nuevos: **{r['objetos_nuevos']}**",
            f"- Objetos con cambios de contenido: **{r['objetos_con_cambios_de_contenido']}**",
            f"- Objetos que ya no aparecen: **{r['objetos_eliminados_de_osm']}**",
            f"- Cambios solo de metadatos: **{r['objetos_con_solo_cambio_de_metadatos']}**",
            "",
            "El informe detallado queda adjunto como artefacto. No se modifica ni publica el catálogo."
          ]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("\n".join(lines) + "\n")
          PY

      - name: Añadir resumen de propuestas de direcciones
        if: success() && hashFiles('v3/propuestas_direcciones_osm.json') != ''
        run: |
          python - <<'PY'
          import json, os
          p=json.load(open("v3/propuestas_direcciones_osm.json", encoding="utf-8"))
          r=p["resumen"]
          lines=[
            "",
            "## Propuestas de direcciones para fichas sin dirección",
            f"- Fichas activas sin dirección: **{r['fichas_activas_sin_direccion']}**",
            f"- Con ID OSM: **{r['sin_direccion_con_id_osm']}**",
            f"- Sin ID OSM: **{r['sin_direccion_sin_id_osm']}**",
            f"- Propuestas generadas: **{r['propuestas_direccion_generadas']}**",
            f"- Sin etiquetas postales utilizables: **{r['sin_etiquetas_postales_utilizables']}**",
            "- Direcciones existentes sobrescritas: **0**",
            "- Fichas publicadas automáticamente: **0**"
          ]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("\n".join(lines) + "\n")
          PY

      - name: Guardar extracción completa, auditoría y diferencias
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auditoria-osm-chiclana-${{ github.run_id }}
          path: |
            v3/osm_chiclana_extraccion_completa.json
            v3/osm_chiclana_cruce_catalogo.json
            v3/osm_chiclana_cambios_semanales.json
            v3/propuestas_direcciones_osm.json
            v3/osm_candidatas_resumen.json
            v3/osm_candidatas_pendientes.json
          if-no-files-found: warn
          compression-level: 6
          retention-days: 8
