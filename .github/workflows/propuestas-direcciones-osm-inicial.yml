name: Propuestas iniciales de direcciones OSM

on:
  push:
    paths:
      - ".github/workflows/propuestas-direcciones-osm-inicial.yml"
      - "v3/proponer_direcciones_osm_inicial.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xiclana-propuestas-direcciones-iniciales
  cancel-in-progress: false

jobs:
  propuestas:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generar propuestas sin modificar el catálogo
        run: python v3/proponer_direcciones_osm_inicial.py

      - name: Publicar resumen
        run: |
          python - <<'PY'
          import json, os
          p=json.load(open("v3/propuestas_direcciones_osm_inicial.json", encoding="utf-8"))
          r=p["resumen"]
          lines=[
            "## Propuestas de direcciones OSM — extracción inicial",
            f"- Fichas activas sin dirección: **{r['fichas_activas_sin_direccion']}**",
            f"- Con identificador OSM: **{r['sin_direccion_con_id_osm']}**",
            f"- Sin identificador OSM: **{r['sin_direccion_sin_id_osm']}**",
            f"- Propuestas generadas: **{r['propuestas_direccion_generadas']}**",
            f"- Sin etiquetas postales utilizables: **{r['sin_etiquetas_postales_utilizables']}**",
            "- Direcciones existentes sobrescritas: **0**",
            "- Fichas publicadas automáticamente: **0**"
          ]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("\n".join(lines) + "\n")
          PY

      - name: Guardar propuestas para revisión
        uses: actions/upload-artifact@v4
        with:
          name: propuestas-direcciones-osm-inicial-${{ github.run_id }}
          path: v3/propuestas_direcciones_osm_inicial.json
          if-no-files-found: error
          retention-days: 90
