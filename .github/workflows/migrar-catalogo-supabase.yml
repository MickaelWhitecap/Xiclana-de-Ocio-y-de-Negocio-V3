name: Migración inicial JSON a Supabase (completada y retirada)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Confirmar migración completada
        run: |
          echo "La migración inicial a public.listings ya está completada y verificada."
          echo "No volver a ejecutar la importación desde fichas_completas.json."
          echo "Las altas y modificaciones ordinarias se realizan directamente en Supabase."
