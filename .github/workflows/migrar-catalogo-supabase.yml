name: Migrar catálogo maestro a Supabase
on:
  push:
    branches:
      - arquitectura-fuente-unica-supabase
  workflow_dispatch:
permissions:
  contents: read
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Migrar 1.302 fichas y los cambios administrativos
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python v3/migrar_catalogo_supabase.py
