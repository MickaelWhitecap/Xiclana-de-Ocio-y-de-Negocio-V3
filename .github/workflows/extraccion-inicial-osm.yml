name: Extraccion inicial completa de OpenStreetMap

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: xiclana-catalogo-maestro
  cancel-in-progress: false

jobs:
  extraer:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Descargar todos los objetos y etiquetas del municipio
        run: python v3/extraccion_inicial_osm.py
      - name: Guardar extracción en el catálogo maestro
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v3/fichas_completas.json
          if ! git diff --cached --quiet; then
            git commit -m "Incorporar extracción inicial OSM al catálogo maestro"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
