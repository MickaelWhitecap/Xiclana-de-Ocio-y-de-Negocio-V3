name: Auditoría de arquitectura V3 (PR)
on:
  pull_request:
    branches: [main]
    paths:
      - "v3/index.html"
      - "v3/admin.html"
      - "v3/exportar-fichas.html"
      - "v3/test_auditar_catalogo.py"
      - "v3/migrar_catalogo_supabase.py"
      - "v3/actualizar.py"
      - "v3/ampliar_catalogo.py"
      - "v3/auditar_catalogo.py"
      - "v3/incorporar_auditoria_osm.py"
      - "v3/extraccion_inicial_osm.py"
      - "v3/recuperar_direcciones_osm.py"
      - "v3/catalogo_supabase.py"
      - "v3/test_fuente_unica.py"
      - "v3/incorporar_candidatas_osm.py"
      - "v3/auditar_osm_municipal.py"
      - "v3/proponer_direcciones_osm.py"
      - "v3/comparar_cambios_osm.py"
      - "v3/rastreo_web_publico.py"
      - "v3/auditar_bajas_catalogo.py"
      - "v3/extraccion_inicial_osm.py"
      - "v3/incorporar_auditoria_osm.py"
      - "v3/recuperar_direcciones_osm.py"
      - ".github/workflows/extraccion-inicial-osm.yml"
      - ".github/workflows/prueba-rad-real.yml"
      - ".github/workflows/rad-catalog-validation.yml"
      - ".github/workflows/rad-review-old-candidates.yml"
      - ".github/workflows/recuperar-direcciones-osm.yml"
      - ".github/workflows/migrar-catalogo-supabase.yml"
      - ".github/workflows/auditoria-osm-municipal.yml"
      - ".github/workflows/rad-enrich-catalog.yml"
      - ".github/workflows/rad-pending-review.yml"
      - ".github/workflows/integrar-candidatas-rad.yml"
      - ".github/workflows/incorporar-auditoria-osm.yml"
      - ".github/workflows/auditar-bajas-catalogo.yml"
      - ".github/workflows/auditar-pr-v3.yml"
      - ".github/workflows/publicar-v3.yml"
      - ".github/workflows/sincronizar-cambios-admin.yml"
      - ".github/workflows/sync-admin-overrides.yml"
      - ".github/workflows/backup-supabase.yml"
permissions:
  contents: read
jobs:
  auditar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Comprobar sintaxis Python
        run: python -m py_compile v3/catalogo_supabase.py v3/migrar_catalogo_supabase.py v3/actualizar.py v3/ampliar_catalogo.py v3/auditar_catalogo.py v3/incorporar_candidatas_osm.py v3/auditar_osm_municipal.py v3/proponer_direcciones_osm.py v3/comparar_cambios_osm.py v3/rastreo_web_publico.py v3/auditar_bajas_catalogo.py v3/extraccion_inicial_osm.py v3/incorporar_auditoria_osm.py v3/recuperar_direcciones_osm.py v3/test_auditar_catalogo.py v3/test_fuente_unica.py
      - name: Comprobar sintaxis JavaScript de las páginas
        run: |
          python - <<'PY'
          import re, pathlib
          for page in ("v3/index.html", "v3/admin.html", "v3/exportar-fichas.html"):
              html = pathlib.Path(page).read_text(encoding="utf-8")
              scripts = re.findall(r'<script(?![^>]*\bsrc=)[^>]*>([\s\S]*?)</script>', html, re.I)
              pathlib.Path("/tmp/" + pathlib.Path(page).stem + ".js").write_text("\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/index.js
          node --check /tmp/admin.js
          node --check /tmp/exportar-fichas.js
      - name: Probar reglas de catálogo y fuente única
        run: |
          python -m unittest v3/test_auditar_catalogo.py v3/test_fuente_unica.py
          python - <<'PY'
          from pathlib import Path
          public=Path("v3/index.html").read_text(encoding="utf-8")
          admin=Path("v3/admin.html").read_text(encoding="utf-8")
          exporter=Path("v3/exportar-fichas.html").read_text(encoding="utf-8")
          publish=Path(".github/workflows/publicar-v3.yml").read_text(encoding="utf-8")
          for name, source in (("web pública",public),("Administración",admin),("exportador",exporter)):
              if 'fetch("./fichas_completas.json' in source or 'fetch("fichas_completas.json' in source:
                  raise SystemExit(f"{name} aún depende del JSON local.")
          if "listings?select=id,data,verified_at" not in public:
              raise SystemExit("La web pública no lee la tabla canónica listings.")
          if 'client.from("site_settings")' not in admin or 'supabaseFrom("listings")' not in admin:
              raise SystemExit("Administración no está conectada a la base canónica.")
          if "no se incluye fichas_completas.json" not in publish:
              raise SystemExit("El despliegue todavía incluye el catálogo JSON.")
          print("Arquitectura verificada: web, Administración y exportador usan Supabase; no usan JSON local.")
          PY
