name: Auditoría de integridad V3 (PR)
on:
  pull_request:
    branches: [main]
    paths:
      - "v3/fichas_completas.json"
      - "v3/catalogo_auto_baseline.json"
      - "v3/plan_consolidacion.json"
      - "v3/auditar_catalogo.py"
      - "v3/test_auditar_catalogo.py"
      - "v3/ampliar_catalogo.py"
      - "v3/actualizar.py"
      - "v3/index.html"
      - "v3/admin.html"
      - ".github/workflows/auditar-pr-v3.yml"
      - ".github/workflows/publicar-v3.yml"
permissions:
  contents: read
jobs:
  auditar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Comprobar sintaxis Python
        run: python -m py_compile v3/auditar_catalogo.py v3/ampliar_catalogo.py v3/actualizar.py
      - name: Comprobar sintaxis JavaScript de las páginas
        run: |
          python - <<'PY'
          import re, pathlib
          for page in ("v3/index.html", "v3/admin.html"):
              html = pathlib.Path(page).read_text(encoding="utf-8")
              scripts = re.findall(r'<script(?![^>]*\bsrc=)[^>]*>([\s\S]*?)</script>', html, re.I)
              pathlib.Path("/tmp/" + pathlib.Path(page).stem + ".js").write_text("\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/index.js
          node --check /tmp/admin.js
      - name: Probar que ocio y negocio no se confundan como duplicados
        run: python -m unittest v3/test_auditar_catalogo.py
      - name: Validar estructura e informar duplicados
        run: python v3/auditar_catalogo.py
      - name: Guardar informes de auditoría para revisión
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auditoria-catalogo-v3
          path: |
            v3/auditoria_integridad.json
            v3/plan_consolidacion.json
          if-no-files-found: ignore
          retention-days: 14
