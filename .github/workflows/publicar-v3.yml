name: Publicar Xiclana V3
on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Auditoría municipal completa de OpenStreetMap"
      - "Recuperar propuestas de direcciones OSM"
      - "RAD - enriquecimiento del catálogo global"
      - "Integrar candidatas RAD al catálogo global"
    types:
      - completed
  push:
    branches: [main]
    paths-ignore:
      - "v3/incorporar_candidatas_osm.py"
      - "v3/osm_candidatas_pendientes.json"
      - "v3/propuestas_direcciones_osm.json"
      - "v3/osm_candidatas_resumen.json"
      - "v3/auditar_bajas_catalogo.py"
      - "v3/recuperar_direcciones_osm.py"
      - ".github/workflows/recuperar-direcciones-osm.yml"
      - ".github/workflows/auditoria-osm-municipal.yml"
      - ".github/workflows/auditar-bajas-catalogo.yml"
      - ".github/workflows/backup-supabase.yml"
  schedule:
    - cron: "0 4 * * 1"
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: xiclana-catalogo-maestro
  cancel-in-progress: false
jobs:
  publicar:
    if: (github.actor != 'github-actions[bot]' || github.event_name != 'push') && (github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Ejecutar pruebas de regresión antes de sincronizar
        run: python -m unittest v3/test_auditar_catalogo.py
      - name: Validar sintaxis JavaScript de las páginas V3
        run: |
          python - <<'PY'
          import pathlib, re
          for page in ("v3/index.html", "v3/admin.html"):
              html=pathlib.Path(page).read_text(encoding="utf-8")
              scripts=re.findall(r"<script(?![^>]*\bsrc=)[^>]*>([\s\\S]*?)</script>", html, re.I)
              pathlib.Path("/tmp/"+pathlib.Path(page).stem+"-inline-check.js").write_text("\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/index-inline-check.js
          node --check /tmp/admin-inline-check.js
      - name: Validar el fichero maestro único
        run: python v3/actualizar.py
      - name: Ampliar catálogo en el fichero maestro
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python v3/ampliar_catalogo.py
      - name: Auditar integridad del catálogo
        run: python v3/auditar_catalogo.py
      - name: Validar catálogo e informes antes de publicar
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for name in ("fichas_completas.json", "auditoria_integridad.json", "plan_consolidacion.json"):
              path = Path("v3") / name
              if not path.is_file():
                  raise SystemExit(f"Falta el archivo requerido: {path}")
              with path.open(encoding="utf-8") as stream:
                  json.load(stream)
          catalog = json.loads(Path("v3/fichas_completas.json").read_text(encoding="utf-8"))
          if not isinstance(catalog.get("items"), list):
              raise SystemExit("El catálogo no contiene una lista items válida.")
          report = json.loads(Path("v3/auditoria_integridad.json").read_text(encoding="utf-8"))
          if not isinstance(report, dict) or "parametros_documentados_por_ficha" not in report:
              raise SystemExit("El informe de auditoría no contiene las estadísticas esperadas.")
          PY
      - name: Guardar el catálogo maestro
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v3/fichas_completas.json v3/auditoria_integridad.json v3/plan_consolidacion.json
          if ! git diff --cached --quiet; then
            git commit -m "Actualizar catálogo maestro V3"
            # Integrar cualquier escritura concurrente antes de actualizar main.
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "El catálogo maestro no ha cambiado."
          fi
      - name: Preparar sitio V3 independiente sin cargar el archivo de auditoría OSM
        run: |
          set -euo pipefail
          mkdir -p _site
          cp v3/index.html v3/admin.html v3/exportar-fichas.html v3/supabase-config.js _site/
          python - <<'PY'
          import json
          from pathlib import Path
          import os
          index_path = Path("_site/index.html")
          index_html = index_path.read_text(encoding="utf-8")
          build_id = os.environ["GITHUB_SHA"]
          if "__XICLANA_BUILD_ID__" not in index_html:
              raise SystemExit("Falta el marcador de versión del catálogo en index.html.")
          index_path.write_text(index_html.replace("__XICLANA_BUILD_ID__", build_id), encoding="utf-8")
          source = json.loads(Path("v3/fichas_completas.json").read_text(encoding="utf-8"))
          # La extracción íntegra y los informes permanecen en el catálogo maestro de GitHub.
          # No se envían al navegador: son datos de auditoría y harían muy pesada la web.
          for key in ("osm_extraccion_inicial", "auditoria_osm"):
              source.pop(key, None)
          Path("_site/fichas_completas.json").write_text(
              json.dumps(source, ensure_ascii=False, separators=(",", ":")),
              encoding="utf-8"
          )
          print(f"Catálogo público preparado: {len(source.get('items', []))} registros; auditoría OSM excluida.")
          PY
          cp v3/espacio-1-flamenca.jpg _site/
          cp README.md _site/README.md
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Verificar que Pages sirve el mismo catálogo y HTML desplegados
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 10 --retry-delay 5 "${PAGES_URL}index.html?build=${GITHUB_SHA}" -o /tmp/xiclana-index.html
          grep -Fq "${GITHUB_SHA}" /tmp/xiclana-index.html
          curl --fail --silent --show-error --retry 10 --retry-delay 5 "${PAGES_URL}fichas_completas.json?build=${GITHUB_SHA}" -o /tmp/xiclana-catalogo-publicado.json
          cmp _site/fichas_completas.json /tmp/xiclana-catalogo-publicado.json
          echo "Verificación pública correcta: HTML versionado y JSON idéntico al artefacto desplegado."
