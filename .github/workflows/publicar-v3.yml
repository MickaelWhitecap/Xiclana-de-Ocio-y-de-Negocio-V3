name: Publicar Xiclana V3 desde Supabase
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: xiclana-pages-supabase
  cancel-in-progress: true
jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validar sintaxis JavaScript de las páginas
        run: |
          python - <<'PY'
          import pathlib, re
          for page in ("v3/index.html", "v3/admin.html", "v3/exportar-fichas.html"):
              html=pathlib.Path(page).read_text(encoding="utf-8")
              scripts=re.findall(r'<script(?![^>]*\bsrc=)[^>]*>([\s\S]*?)</script>',html,re.I)
              pathlib.Path("/tmp/"+pathlib.Path(page).stem+".js").write_text("\n".join(scripts),encoding="utf-8")
          PY
          node --check /tmp/index.js
          node --check /tmp/admin.js
          node --check /tmp/exportar-fichas.js
      - name: Preparar sitio sin catálogo JSON local
        env:
          BUILD_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          mkdir -p _site
          cp v3/index.html v3/admin.html v3/exportar-fichas.html v3/supabase-config.js _site/
          cp v3/espacio-1-flamenca.jpg _site/
          cp README.md _site/README.md
          python - <<'PY'
          import os
          from pathlib import Path
          build=os.environ["BUILD_ID"]
          for name in ("index.html","admin.html","exportar-fichas.html"):
              p=Path("_site")/name
              html=p.read_text(encoding="utf-8")
              html=html.replace("</head>",f"<!-- XICLANA_BUILD_ID={build} -->\\n</head>",1)
              p.write_text(html,encoding="utf-8")
          print("Sitio preparado: el navegador consultará Supabase; no se incluye fichas_completas.json.")
          PY
          python - <<'PY' >> "$GITHUB_ENV"
          import re
          from pathlib import Path
          s=Path("v3/supabase-config.js").read_text(encoding="utf-8")
          url=re.search(r'url:\s*"([^"]+)"',s).group(1)
          key=re.search(r'anonKey:\s*"([^"]+)"',s).group(1)
          print("SUPABASE_URL="+url)
          print("SUPABASE_ANON_KEY="+key)
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Verificar web y lectura pública de la base única
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
          BUILD_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 10 --retry-delay 5 "${PAGES_URL}index.html?build=${BUILD_ID}" -o /tmp/index.html
          curl --fail --silent --show-error --retry 10 --retry-delay 5 "${PAGES_URL}admin.html?build=${BUILD_ID}" -o /tmp/admin.html
          grep -Fq "XICLANA_BUILD_ID=${BUILD_ID}" /tmp/index.html
          grep -Fq "XICLANA_BUILD_ID=${BUILD_ID}" /tmp/admin.html
          curl --fail --silent --show-error "${SUPABASE_URL}/rest/v1/listings?select=id&is_published=eq.true&is_deleted=eq.false&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" -o /tmp/listings.json
          curl --fail --silent --show-error "${SUPABASE_URL}/rest/v1/site_settings?select=id&id=eq.catalogo" \
            -H "apikey: ${SUPABASE_ANON_KEY}" -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" -o /tmp/settings.json
          python - <<'PY'
          import json
          listings=json.load(open("/tmp/listings.json",encoding="utf-8"))
          settings=json.load(open("/tmp/settings.json",encoding="utf-8"))
          if not listings or not settings:
              raise SystemExit("Supabase no devuelve fichas o metadatos con la clave pública.")
          print(f"Verificado: {len(listings)} muestra(s) de fichas y {len(settings)} metadatos disponibles públicamente.")
          PY
