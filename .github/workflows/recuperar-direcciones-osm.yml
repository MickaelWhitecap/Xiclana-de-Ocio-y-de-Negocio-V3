name: Recuperar propuestas de direcciones OSM

on:
  push:
    paths:
      - "v3/recuperar_direcciones_osm.py"
      - ".github/workflows/recuperar-direcciones-osm.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recuperar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Consultar etiquetas de dirección de OpenStreetMap
        run: python v3/recuperar_direcciones_osm.py
      - name: Guardar propuestas dentro del catálogo maestro
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v3/fichas_completas.json
          if ! git diff --cached --quiet; then
            git commit -m "Incorporar propuestas de direcciones OSM al catálogo maestro"
            git push
          fi
