name: Recuperación de direcciones OSM desde JSON (retirada)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Confirmar retirada
        run: |
          echo "Retirado: las propuestas de direcciones OSM se generan en auditoria-osm-municipal.yml."
          echo "Se guardan en public.site_settings y se aplican manualmente desde Administración."
          echo "No se escriben propuestas en fichas_completas.json."
